<!DOCTYPE html>
<html>
<head>
<link rel="stylesheet" href="../css/style.css">
</head>

<body>

<h2>Invoice & POD Upload</h2>

<form
action="../invoice-upload.php"
method="POST"
enctype="multipart/form-data">

<label>Invoice PDF</label>
<input
type="file"
name="invoice"
accept=".pdf,.doc,.docx">

<br><br>

<label>Proof of Delivery</label>
<input
type="file"
name="pod"
accept=".pdf,.jpg,.png">

<br><br>

<button type="submit">
Upload Files
</button>

</form>

</body>
</html>
